<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title"><title id="title">Listed-rate arithmetic before taxes</title><rect width="1200" height="675" fill="#edf5f2"/><text x="70" y="80" font-family="Arial,sans-serif" font-size="22" fill="#12634d">TICKETSCOUT · TICKET CHECK</text><g font-family="Arial,sans-serif"><text x="70" y="150" font-size="42" font-weight="700" fill="#183c39">Listed-rate arithmetic before taxes</text><rect x="70" y="205" width="1060" height="85" rx="16" fill="#fff"/><text x="95" y="240" fill="#12634d" font-size="21" font-weight="700">REGULAR</text><text x="295" y="255" fill="#203d43" font-size="26">$30 + 12 x $10 = $150</text><rect x="70" y="310" width="1060" height="85" rx="16" fill="#fff"/><text x="95" y="345" fill="#12634d" font-size="21" font-weight="700">GOLD</text><text x="295" y="360" fill="#203d43" font-size="26">$40 + 12 x $12 = $184</text><rect x="70" y="415" width="1060" height="85" rx="16" fill="#fff"/><text x="95" y="450" fill="#12634d" font-size="21" font-weight="700">PRESTIGE</text><text x="295" y="465" fill="#203d43" font-size="26">$40 + 12 x $28 = $376</text><text x="70" y="600" font-size="24" fill="#203d43">Arithmetic from October 5 listings; not checkout totals.</text></g></svg>