<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title"><title id="title">Complete the plan before comparing</title><rect width="1200" height="675" fill="#edf5f2"/><text x="70" y="80" font-family="Arial,sans-serif" font-size="22" fill="#12634d">TICKETSCOUT · TICKET CHECK</text><g font-family="Arial,sans-serif"><text x="70" y="150" font-size="42" font-weight="700" fill="#183c39">Complete the plan before comparing</text><rect x="70" y="205" width="1060" height="85" rx="16" fill="#fff"/><text x="95" y="240" fill="#12634d" font-size="21" font-weight="700">COUNT</text><text x="295" y="255" fill="#203d43" font-size="26">Count tickets, not all attendees</text><rect x="70" y="310" width="1060" height="85" rx="16" fill="#fff"/><text x="95" y="345" fill="#12634d" font-size="21" font-weight="700">COVERAGE</text><text x="295" y="360" fill="#203d43" font-size="26">Same days and desired access</text><rect x="70" y="415" width="1060" height="85" rx="16" fill="#fff"/><text x="95" y="450" fill="#12634d" font-size="21" font-weight="700">QUOTE</text><text x="295" y="465" fill="#203d43" font-size="26">Confirm actual seller totals</text><text x="70" y="600" font-size="24" fill="#203d43">Eligibility and reservations remain separate checks.</text></g></svg>